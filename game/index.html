<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>GPLab — Игра</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ============================================================
     БИБЛИОТЕКА ИКОНОК (SVG symbols)
     ============================================================ -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></symbol>
    <symbol id="i-shop" viewBox="0 0 24 24"><path d="M3 9l1.5-5h15L21 9"/><path d="M3 9h18v11H3z"/><path d="M9 20v-6h6v6"/></symbol>
    <symbol id="i-skill" viewBox="0 0 24 24"><path d="M12 2l2.6 6.3L21 9l-5 4.4L17.5 20 12 16.6 6.5 20 8 13.4 3 9l6.4-.7z"/></symbol>
    <symbol id="i-sound-on" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 8.5a5 5 0 010 7"/><path d="M19.5 6a8.5 8.5 0 010 12"/></symbol>
    <symbol id="i-sound-off" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9l5 6M22 9l-5 6"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></symbol>
    <symbol id="i-restart" viewBox="0 0 24 24"><path d="M20 12a8 8 0 11-2.3-5.6"/><path d="M20 4v5h-5"/></symbol>
    <symbol id="i-coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v9M9.5 10h5M9.5 14h5"/></symbol>
    <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2L4 14h6l-1 8 9-12h-6z"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2l2.6 6.3L21 9l-5 4.4L17.5 20 12 16.6 6.5 20 8 13.4 3 9l6.4-.7z"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></symbol>
    <symbol id="i-skull" viewBox="0 0 24 24"><path d="M12 2a8 8 0 00-8 8c0 3 1.6 5.2 3 6.5V21h10v-4.5c1.4-1.3 3-3.5 3-6.5a8 8 0 00-8-8z"/><circle cx="9" cy="11" r="1.4"/><circle cx="15" cy="11" r="1.4"/><path d="M10 17h4"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 2l8 3.5v6c0 5-3.4 8.8-8 10.5-4.6-1.7-8-5.5-8-10.5v-6z"/></symbol>
    <symbol id="i-magnet" viewBox="0 0 24 24"><path d="M6 3v9a6 6 0 0012 0V3"/><path d="M6 8h4M14 8h4"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-9.5A4.5 4.5 0 0112 7a4.5 4.5 0 017 3.5C19 15.6 12 20 12 20z"/></symbol>
    <symbol id="i-speed" viewBox="0 0 24 24"><path d="M4 18a8 8 0 1116 0"/><path d="M12 18l4-6"/></symbol>
    <symbol id="i-combo" viewBox="0 0 24 24"><path d="M4 18l4-8 4 5 4-9 4 12"/></symbol>
    <symbol id="i-regen" viewBox="0 0 24 24"><path d="M20 12a8 8 0 11-3-6.2"/><path d="M20 4v5h-5"/><path d="M12 9v6M9 12h6"/></symbol>
    <symbol id="i-dash" viewBox="0 0 24 24"><path d="M4 12h9"/><path d="M9 7l5 5-5 5"/><path d="M17 6v12"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 018 0v3"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol>
    <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 01-8 0z"/><path d="M8 5H5v2a3 3 0 003 3M16 5h3v2a3 3 0 01-3 3"/><path d="M12 13v4M9 20h6"/></symbol>
    <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1"/></symbol>
  </defs>
</svg>

<div id="app">

  <!-- ============================================================
       ЭКРАН: ГЛАВНОЕ МЕНЮ
       ============================================================ -->
  <section class="screen active" id="screen-menu">
    <div class="menu-wrap">
      <div class="logo-block">
        <div class="logo-title">GPLab</div>
        <div class="logo-sub">Automaton Protocol</div>
      </div>

      <div class="menu-stats">
        <div class="stat-chip">
          <svg class="ico" viewBox="0 0 24 24"><use href="#i-coin"/></svg>
          <span>Монеты:</span><b id="menuCoins">0</b>
        </div>
        <div class="stat-chip">
          <svg class="ico" viewBox="0 0 24 24"><use href="#i-trophy"/></svg>
          <span>Рекорд:</span><b id="menuBest">0</b>
        </div>
        <div class="stat-chip">
          <svg class="ico" viewBox="0 0 24 24"><use href="#i-star"/></svg>
          <span>Уровень:</span><b id="menuLevel">1</b>
        </div>
      </div>

      <div class="menu-buttons">
        <button class="btn btn-primary" data-action="play">
          <svg class="ico" viewBox="0 0 24 24"><use href="#i-play"/></svg>
          Играть
        </button>
        <button class="btn" data-action="shop">
          <svg class="ico" viewBox="0 0 24 24"><use href="#i-shop"/></svg>
          Магазин
        </button>
        <button class="btn" data-action="skills">
          <svg class="ico" viewBox="0 0 24 24"><use href="#i-skill"/></svg>
          Навыки
        </button>
        <button class="btn btn-ghost" data-action="sound">
          <svg class="ico" id="menuSoundIco" viewBox="0 0 24 24"><use href="#i-sound-on"/></svg>
          <span id="menuSoundText">Звук: вкл</span>
        </button>
      </div>
    </div>
  </section>

  <!-- ============================================================
       ЭКРАН: МАГАЗИН
       ============================================================ -->
  <section class="screen" id="screen-shop">
    <div class="panel-screen">
      <div class="panel-head">
        <div class="panel-title">
          <svg class="ico" viewBox="0 0 24 24"><use href="#i-shop"/></svg>
          Магазин
        </div>
        <div style="display:flex;gap:10px;align-items:center">
          <div class="stat-chip">
            <svg class="ico" viewBox="0 0 24 24"><use href="#i-coin"/></svg>
            <b id="shopCoins">0</b>
          </div>
          <button class="btn btn-sm btn-ghost" data-action="back-menu">
            <svg class="ico" viewBox="0 0 24 24"><use href="#i-back"/></svg>
            Назад
          </button>
        </div>
      </div>
      <div class="panel-body">
        <div class="shop-grid" id="shopGrid"></div>
      </div>
    </div>
  </section>

  <!-- ============================================================
       ЭКРАН: НАВЫКИ
       ============================================================ -->
  <section class="screen" id="screen-skills">
    <div class="panel-screen">
      <div class="panel-head">
        <div class="panel-title">
          <svg class="ico" viewBox="0 0 24 24"><use href="#i-skill"/></svg>
          Навыки
        </div>
        <div style="display:flex;gap:10px;align-items:center">
          <div class="stat-chip">
            <svg class="ico" viewBox="0 0 24 24"><use href="#i-coin"/></svg>
            <b id="skillsCoins">0</b>
          </div>
          <button class="btn btn-sm btn-ghost" data-action="back-menu">
            <svg class="ico" viewBox="0 0 24 24"><use href="#i-back"/></svg>
            Назад
          </button>
        </div>
      </div>
      <div class="panel-body">
        <div class="skills-grid" id="skillsGrid"></div>
      </div>
    </div>
  </section>

  <!-- ============================================================
       ЭКРАН: ИГРА
       ============================================================ -->
  <section class="screen" id="screen-game">
    <canvas id="gameCanvas"></canvas>

    <div class="hud">
      <div class="hud-left">
        <div class="hud-stat gold">
          <svg class="ico" viewBox="0 0 24 24"><use href="#i-coin"/></svg>
          <span id="hudScore">0</span>
        </div>
        <div class="hud-stat">
          <svg class="ico" viewBox="0 0 24 24"><use href="#i-star"/></svg>
          <span id="hudLevel">1</span>
        </div>
        <div class="hud-stat">
          <svg class="ico" viewBox="0 0 24 24"><use href="#i-combo"/></svg>
          <span id="hudCombo">x1</span>
        </div>
      </div>
      <div class="hud-right">
        <div class="hud-stat">
          <svg class="ico" viewBox="0 0 24 24"><use href="#i-clock"/></svg>
          <span id="hudTime">0:00</span>
        </div>
        <button class="hud-btn" id="btnSound" title="Звук">
          <svg class="ico" id="hudSoundIco" viewBox="0 0 24 24"><use href="#i-sound-on"/></svg>
        </button>
        <button class="hud-btn" id="btnPause" title="Пауза">
          <svg class="ico" viewBox="0 0 24 24"><use href="#i-pause"/></svg>
        </button>
      </div>
    </div>

    <div class="energy-wrap">
      <div class="energy-label">
        <svg class="ico" viewBox="0 0 24 24"><use href="#i-bolt"/></svg>
        Энергия
      </div>
      <div class="energy-bar">
        <div class="energy-fill" id="energyFill"></div>
      </div>
    </div>

    <!-- Тач-управление (видно только на телефонах и планшетах) -->
    <div class="touch-controls" id="touchControls">
      <div class="stick" id="stick">
        <div class="stick-knob" id="stickKnob"></div>
      </div>
      <button class="dash-btn" id="dashBtn" aria-label="Рывок">
        <svg class="ico" viewBox="0 0 24 24"><use href="#i-dash"/></svg>
      </button>
    </div>

    <!-- Пауза -->
    <div class="overlay" id="overlayPause">
      <div class="overlay-card">
        <div class="overlay-title">Пауза</div>
        <div class="overlay-sub">Передохни. Игра ждёт.</div>
        <div class="overlay-actions">
          <button class="btn btn-primary" data-action="resume">
            <svg class="ico" viewBox="0 0 24 24"><use href="#i-play"/></svg>
            Продолжить
          </button>
          <button class="btn btn-ghost" data-action="restart">
            <svg class="ico" viewBox="0 0 24 24"><use href="#i-restart"/></svg>
            Заново
          </button>
          <button class="btn btn-ghost" data-action="back-menu">
            <svg class="ico" viewBox="0 0 24 24"><use href="#i-home"/></svg>
            В меню
          </button>
        </div>
      </div>
    </div>

    <!-- Смерть -->
    <div class="overlay" id="overlayDead">
      <div class="overlay-card">
        <div class="overlay-title dead">Конец</div>
        <div class="new-record" id="newRecord" style="display:none">Новый рекорд!</div>
        <div class="result-grid">
          <div class="result-item"><span>Очки</span><b id="resScore">0</b></div>
          <div class="result-item"><span>Уровень</span><b id="resLevel">1</b></div>
          <div class="result-item"><span>Время</span><b id="resTime">0:00</b></div>
          <div class="result-item"><span>Монеты</span><b id="resCoins">0</b></div>
        </div>
        <div class="overlay-actions">
          <button class="btn btn-primary" data-action="restart">
            <svg class="ico" viewBox="0 0 24 24"><use href="#i-restart"/></svg>
            Ещё раз
          </button>
          <button class="btn btn-ghost" data-action="back-menu">
            <svg class="ico" viewBox="0 0 24 24"><use href="#i-home"/></svg>
            В меню
          </button>
        </div>
      </div>
    </div>
  </section>

</div>

<div id="toasts"></div>

<script src="js/config.js"></script>
<script src="entities/bullets.js"></script>
<script src="js/app.js"></script>
<script src="game.js"></script>
</body>
</html>

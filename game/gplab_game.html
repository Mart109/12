<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Ядро — GPLab</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #05070f;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    color: #e8f0ff;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #wrap { position: relative; width: 100%; height: 100%; }
  canvas { display: block; width: 100%; height: 100%; }

  /* ---------- HUD ---------- */
  .hud {
    position: absolute; top: 0; left: 0; right: 0;
    padding: 16px 20px;
    display: flex; justify-content: space-between; align-items: flex-start;
    pointer-events: none;
    font-variant-numeric: tabular-nums;
    z-index: 5;
  }
  .hud-left { display: flex; flex-direction: column; gap: 10px; }
  .hud-right { display: flex; flex-direction: column; gap: 10px; align-items: flex-end; }

  .stat-row { display: flex; align-items: center; gap: 8px; }
  .stat { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; opacity: 0.5; }
  .val { font-size: 26px; font-weight: 700; line-height: 1; }
  .val.small { font-size: 17px; }

  .icon {
    width: 18px; height: 18px; flex: 0 0 18px;
    display: inline-block;
    opacity: 0.85;
  }
  .icon.big { width: 22px; height: 22px; flex: 0 0 22px; }

  .bar {
    width: 200px; height: 9px; border-radius: 5px;
    background: rgba(255,255,255,0.08);
    overflow: hidden;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.5);
  }
  .bar-fill {
    height: 100%; width: 100%;
    background: linear-gradient(90deg, #2ee6a8, #4fc3ff);
    border-radius: 5px;
    transition: width 0.12s linear, background 0.3s;
    box-shadow: 0 0 12px rgba(79,195,255,0.55);
  }
  .bar-fill.low {
    background: linear-gradient(90deg, #ff5a5a, #ff9a3c);
    box-shadow: 0 0 12px rgba(255,90,90,0.6);
  }

  .combo {
    display: flex; align-items: center; gap: 6px;
    font-size: 15px; font-weight: 700; color: #ffd166;
    opacity: 0; transform: translateY(-4px);
    transition: opacity 0.2s, transform 0.2s;
    text-shadow: 0 0 14px rgba(255,209,102,0.65);
  }
  .combo.on { opacity: 1; transform: translateY(0); }

  /* ---------- кнопки ---------- */
  .corner-btns {
    position: absolute; right: 16px; bottom: 16px;
    display: flex; gap: 10px;
    z-index: 6;
  }
  .icon-btn {
    width: 46px; height: 46px; border-radius: 13px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    color: #e8f0ff; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    pointer-events: auto;
    transition: background 0.15s, transform 0.12s, border-color 0.15s;
    backdrop-filter: blur(8px);
  }
  .icon-btn:hover {
    background: rgba(255,255,255,0.14);
    border-color: rgba(79,195,255,0.5);
    transform: translateY(-2px);
  }
  .icon-btn:active { transform: translateY(0); }
  .icon-btn svg { width: 22px; height: 22px; }
  .icon-btn.off { opacity: 0.45; }

  /* ---------- оверлеи ---------- */
  .overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 20px;
    background: radial-gradient(circle at 50% 45%, rgba(10,20,40,0.80), rgba(3,5,12,0.97));
    backdrop-filter: blur(7px);
    text-align: center;
    padding: 24px;
    z-index: 10;
    animation: fadeIn 0.28s ease-out;
  }
  .overlay.hidden { display: none; }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  @keyframes riseIn {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .overlay > * { animation: riseIn 0.4s ease-out backwards; }
  .overlay > *:nth-child(2) { animation-delay: 0.05s; }
  .overlay > *:nth-child(3) { animation-delay: 0.1s; }
  .overlay > *:nth-child(4) { animation-delay: 0.15s; }
  .overlay > *:nth-child(5) { animation-delay: 0.2s; }

  .title {
    font-size: clamp(40px, 9vw, 80px);
    font-weight: 800;
    letter-spacing: 0.16em;
    background: linear-gradient(120deg, #4fc3ff, #2ee6a8 55%, #a78bfa);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 30px rgba(79,195,255,0.4));
  }
  .subtitle {
    font-size: 13px; opacity: 0.55;
    letter-spacing: 0.3em; text-transform: uppercase;
    margin-top: -12px;
  }

  .hint {
    font-size: 14px; line-height: 2;
    opacity: 0.78;
    max-width: 480px;
    display: flex; flex-direction: column; gap: 2px;
  }
  .hint-row {
    display: flex; align-items: center; justify-content: center; gap: 9px;
  }
  .hint-row b { color: #4fc3ff; font-weight: 600; }
  .hint-row .icon { opacity: 0.6; }

  .btn {
    padding: 16px 48px;
    font-size: 16px; font-weight: 700; letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #04121c;
    background: linear-gradient(120deg, #2ee6a8, #4fc3ff);
    border: none; border-radius: 15px;
    cursor: pointer;
    box-shadow: 0 8px 32px rgba(46,230,168,0.3);
    transition: transform 0.12s, box-shadow 0.12s;
    display: flex; align-items: center; gap: 10px;
  }
  .btn:hover { transform: translateY(-2px); box-shadow: 0 14px 42px rgba(46,230,168,0.45); }
  .btn:active { transform: translateY(0); }
  .btn svg { width: 18px; height: 18px; }

  .results {
    display: grid; grid-template-columns: auto auto; gap: 12px 40px;
    font-size: 16px;
    padding: 18px 28px;
    background: rgba(255,255,255,0.035);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
  }
  .results .k {
    opacity: 0.55; text-align: right;
    display: flex; align-items: center; justify-content: flex-end; gap: 7px;
  }
  .results .v {
    font-weight: 700; text-align: left;
    font-variant-numeric: tabular-nums;
  }

  .record {
    font-size: 14px; font-weight: 700; color: #ffd166;
    letter-spacing: 0.14em; text-transform: uppercase;
    text-shadow: 0 0 20px rgba(255,209,102,0.6);
    display: flex; align-items: center; gap: 8px;
    animation: pulseGlow 1.6s ease-in-out infinite;
  }
  .record.hidden { display: none; }
  @keyframes pulseGlow {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.6; }
  }

  .dead-title {
    font-size: clamp(30px, 7vw, 54px);
    font-weight: 800; letter-spacing: 0.12em;
    color: #ff6b6b;
    text-shadow: 0 0 34px rgba(255,107,107,0.45);
  }

  /* виньетка поверх канваса */
  .vignette {
    position: absolute; inset: 0;
    pointer-events: none;
    background: radial-gradient(circle at 50% 50%, transparent 45%, rgba(0,0,0,0.55) 100%);
    z-index: 4;
  }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div class="vignette"></div>

  <!-- библиотека иконок -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-energy" viewBox="0 0 24 24">
        <path d="M13 2 4 14h6l-1 8 9-12h-6l1-8z" fill="currentColor"/>
      </symbol>
      <symbol id="i-particle" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="4" fill="currentColor"/>
        <circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.6" opacity="0.45"/>
        <circle cx="19" cy="6" r="1.8" fill="currentColor" opacity="0.7"/>
      </symbol>
      <symbol id="i-level" viewBox="0 0 24 24">
        <path d="M4 20h3v-6H4v6zm6.5 0h3V9h-3v11zM17 20h3V4h-3v16z" fill="currentColor"/>
      </symbol>
      <symbol id="i-trophy" viewBox="0 0 24 24">
        <path d="M7 4h10v5a5 5 0 0 1-10 0V4z" fill="currentColor"/>
        <path d="M7 5H4v2a3 3 0 0 0 3 3M17 5h3v2a3 3 0 0 1-3 3" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <path d="M11 14h2v4h-2zM8 20h8v1.6H8z" fill="currentColor"/>
      </symbol>
      <symbol id="i-sound-on" viewBox="0 0 24 24">
        <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/>
        <path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </symbol>
      <symbol id="i-sound-off" viewBox="0 0 24 24">
        <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/>
        <path d="M16.5 9.5l5 5m0-5l-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </symbol>
      <symbol id="i-pause" viewBox="0 0 24 24">
        <rect x="6" y="4" width="4" height="16" rx="1.2" fill="currentColor"/>
        <rect x="14" y="4" width="4" height="16" rx="1.2" fill="currentColor"/>
      </symbol>
      <symbol id="i-play" viewBox="0 0 24 24">
        <path d="M7 4.5v15l13-7.5-13-7.5z" fill="currentColor"/>
      </symbol>
      <symbol id="i-dash" viewBox="0 0 24 24">
        <path d="M3 12h7M2 8h6M2 16h6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <path d="M13 5l7 7-7 7V5z" fill="currentColor"/>
      </symbol>
      <symbol id="i-key" viewBox="0 0 24 24">
        <rect x="2.5" y="6.5" width="19" height="11" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <path d="M6.5 10.5h2M11 10.5h2M15.5 10.5h2M8 14h8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </symbol>
      <symbol id="i-touch" viewBox="0 0 24 24">
        <path d="M9 11V5.5a1.8 1.8 0 0 1 3.6 0V11" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M12.6 11V9.2a1.7 1.7 0 0 1 3.4 0V13c0 4-2.4 7-6 7s-5-2.6-5-6v-2.4a1.6 1.6 0 0 1 3.2 0V13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </symbol>
      <symbol id="i-clock" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="1.7"/>
        <path d="M12 7.5V12l3 2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
      </symbol>
      <symbol id="i-skull" viewBox="0 0 24 24">
        <path d="M12 3a7 7 0 0 0-7 7v3l2 1.5V18h10v-3.5L19 13v-3a7 7 0 0 0-7-7z" fill="currentColor"/>
        <circle cx="9.2" cy="11" r="1.7" fill="#05070f"/>
        <circle cx="14.8" cy="11" r="1.7" fill="#05070f"/>
      </symbol>
    </defs>
  </svg>

  <div class="hud">
    <div class="hud-left">
      <div>
        <div class="stat-row">
          <svg class="icon"><use href="#i-energy"/></svg>
          <span class="stat">Энергия</span>
        </div>
        <div class="val" id="energyVal">100</div>
      </div>
      <div class="bar"><div class="bar-fill" id="energyBar"></div></div>
      <div class="combo" id="comboVal">
        <svg class="icon"><use href="#i-particle"/></svg>
        <span id="comboText">x1</span>
      </div>
    </div>
    <div class="hud-right">
      <div>
        <div class="stat-row" style="justify-content:flex-end">
          <span class="stat">Частицы</span>
          <svg class="icon"><use href="#i-particle"/></svg>
        </div>
        <div class="val" id="scoreVal">0</div>
      </div>
      <div>
        <div class="stat-row" style="justify-content:flex-end">
          <span class="stat">Уровень</span>
          <svg class="icon"><use href="#i-level"/></svg>
        </div>
        <div class="val small" id="levelVal">1</div>
      </div>
      <div>
        <div class="stat-row" style="justify-content:flex-end">
          <span class="stat">Рекорд</span>
          <svg class="icon"><use href="#i-trophy"/></svg>
        </div>
        <div class="val small" id="bestVal">0</div>
      </div>
    </div>
  </div>

  <div class="corner-btns">
    <button class="icon-btn" id="pauseBtn" title="Пауза (P)">
      <svg><use href="#i-pause"/></svg>
    </button>
    <button class="icon-btn" id="muteBtn" title="Звук">
      <svg><use href="#i-sound-on"/></svg>
    </button>
  </div>

  <div class="overlay" id="startScreen">
    <div class="title">ЯДРО</div>
    <div class="subtitle">GPLab</div>
    <div class="hint">
      <div class="hint-row">
        <svg class="icon"><use href="#i-particle"/></svg>
        Собирай <b>синие частицы</b>, беги от <b>красных сгустков</b>
      </div>
      <div class="hint-row">
        <svg class="icon"><use href="#i-key"/></svg>
        <b>WASD</b> или <b>стрелки</b> — движение
      </div>
      <div class="hint-row">
        <svg class="icon"><use href="#i-dash"/></svg>
        <b>Пробел</b> или <b>Shift</b> — рывок (тратит энергию)
      </div>
      <div class="hint-row">
        <svg class="icon"><use href="#i-pause"/></svg>
        <b>P</b> или <b>Esc</b> — пауза
      </div>
      <div class="hint-row">
        <svg class="icon"><use href="#i-touch"/></svg>
        На телефоне — веди пальцем
      </div>
    </div>
    <button class="btn" id="startBtn">
      <svg><use href="#i-play"/></svg>
      Начать
    </button>
  </div>

  <div class="overlay hidden" id="pauseScreen">
    <div class="title" style="font-size:clamp(30px,7vw,54px)">ПАУЗА</div>
    <button class="btn" id="resumeBtn">
      <svg><use href="#i-play"/></svg>
      Продолжить
    </button>
  </div>

  <div class="overlay hidden" id="deadScreen">
    <svg style="width:52px;height:52px;color:#ff6b6b;opacity:0.85"><use href="#i-skull"/></svg>
    <div class="dead-title">ЯДРО ПОГАСЛО</div>
    <div class="record hidden" id="recordVal">
      <svg class="icon"><use href="#i-trophy"/></svg>
      Новый рекорд
    </div>
    <div class="results">
      <div class="k"><svg class="icon"><use href="#i-particle"/></svg>Частицы</div>
      <div class="v" id="finalScore">0</div>
      <div class="k"><svg class="icon"><use href="#i-level"/></svg>Уровень</div>
      <div class="v" id="finalLevel">1</div>
      <div class="k"><svg class="icon"><use href="#i-clock"/></svg>Время</div>
      <div class="v" id="finalTime">0с</div>
      <div class="k"><svg class="icon"><use href="#i-trophy"/></svg>Рекорд</div>
      <div class="v" id="finalBest">0</div>
    </div>
    <button class="btn" id="retryBtn">
      <svg><use href="#i-play"/></svg>
      Ещё раз
    </button>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
